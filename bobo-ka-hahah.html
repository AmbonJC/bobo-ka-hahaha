<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b22">
  <title>hehe</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow: hidden;
      background:
        radial-gradient(circle at 18% 22%, #6d39a8 0, transparent 30%),
        radial-gradient(circle at 82% 78%, #d84e91 0, transparent 28%),
        linear-gradient(135deg, #100b22, #21103a 55%, #100b22);
      color: #fff; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .glow {
      position: absolute; width: min(72vw, 520px); aspect-ratio: 1;
      border: 1px solid #ffffff22; border-radius: 50%;
      box-shadow: 0 0 90px #c45aff22, inset 0 0 90px #ff69b422;
      animation: breathe 4s ease-in-out infinite;
    }
    h1 {
      position: relative; margin: 0; padding: 24px;
      font-size: clamp(2.8rem, 10vw, 7rem); font-weight: 900;
      letter-spacing: -.07em; text-align: center;
      background: linear-gradient(100deg, #fff 15%, #ffc6ed 48%, #c9b5ff 85%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 12px 55px #ee8dff33;
      animation: pop 1s cubic-bezier(.2,.9,.2,1) both, float 4s ease-in-out 1s infinite;
    }
    .spark {
      position: absolute; color: #ffd7f5; opacity: .7;
      animation: twinkle 2.8s ease-in-out infinite;
    }
    .s1 { top: 18%; left: 19%; font-size: 2rem; }
    .s2 { right: 17%; bottom: 20%; font-size: 1.5rem; animation-delay: .8s; }
    .s3 { top: 25%; right: 25%; font-size: 1rem; animation-delay: 1.4s; }
    @keyframes breathe { 50% { transform: scale(1.08); opacity: .55; } }
    @keyframes pop { from { opacity: 0; transform: scale(.72) rotate(-4deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes float { 50% { translate: 0 -10px; } }
    @keyframes twinkle { 50% { opacity: .2; transform: scale(.65) rotate(35deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <span class="spark s1" aria-hidden="true">✦</span>
  <span class="spark s2" aria-hidden="true">✧</span>
  <span class="spark s3" aria-hidden="true">✦</span>
  <main><h1>bobo ka HAHAH</h1></main>
</body>
</html>
